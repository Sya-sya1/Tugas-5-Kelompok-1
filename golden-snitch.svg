<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 360 220"
     role="img"
     aria-labelledby="snitchTitle snitchDesc">
  <title id="snitchTitle">Golden Snitch</title>
  <desc id="snitchDesc">Golden Snitch dengan bola emas dan dua sayap.</desc>

  <defs>
    <radialGradient id="ballGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="55%" stop-color="#e8b83f"/>
      <stop offset="100%" stop-color="#a66b16"/>
    </radialGradient>
    <linearGradient id="wingGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4c7"/>
      <stop offset="100%" stop-color="#c9a65a"/>
    </linearGradient>
  </defs>

  <g class="wing left-wing">
    <path d="M157 103 C119 58 66 35 22 49
             C57 66 77 88 91 109
             C63 99 39 103 17 117
             C67 126 111 145 158 139 Z"
          fill="url(#wingGold)" stroke="#a88742" stroke-width="3"/>
    <path d="M148 119 Q95 73 39 57 M145 127 Q90 106 30 119"
          fill="none" stroke="#a88742" stroke-width="2"/>
  </g>

  <g class="wing right-wing">
    <path d="M203 103 C241 58 294 35 338 49
             C303 66 283 88 269 109
             C297 99 321 103 343 117
             C293 126 249 145 202 139 Z"
          fill="url(#wingGold)" stroke="#a88742" stroke-width="3"/>
    <path d="M212 119 Q265 73 321 57 M215 127 Q270 106 330 119"
          fill="none" stroke="#a88742" stroke-width="2"/>
  </g>

  <g class="snitch-ball">
    <circle cx="180" cy="116" r="43" fill="url(#ballGold)"
            stroke="#936018" stroke-width="3"/>
    <path d="M157 91 Q174 69 194 87"
          fill="none" stroke="#fff4c7" stroke-width="7"
          stroke-linecap="round"/>
    <circle cx="180" cy="116" r="6" fill="#fff0a5" opacity=".8"/>
  </g>
</svg>
